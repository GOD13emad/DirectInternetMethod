name: Universal Engine Frozen Binary Prototype

on:
  push:
    branches: [feature/universal-install-engine]
    paths:
      - 'installer_engine/**'
      - 'tools/dim_universal_engine_entry.py'
      - 'tools/test_universal_engine_frozen_smoke.py'
      - '.github/workflows/universal-engine-binary.yml'
  pull_request:
    paths:
      - 'installer_engine/**'
      - 'tools/dim_universal_engine_entry.py'
      - 'tools/test_universal_engine_frozen_smoke.py'
      - '.github/workflows/universal-engine-binary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-fixture-prototype:
    name: Frozen CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Fetch immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install version-locked prototype freezer
        run: python -m pip install --disable-pip-version-check --no-input "pyinstaller==6.22.3"
      - name: Build stand-alone fixture CLI (never publish as DIM installer)
        run: python -m PyInstaller --onefile --clean --noconfirm --paths . --name dim-universal-engine tools/dim_universal_engine_entry.py
      - name: Run offline native fixture install, verify and uninstall
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            executable="dist/dim-universal-engine.exe"
          else
            executable="dist/dim-universal-engine"
          fi
          python tools/test_universal_engine_frozen_smoke.py "$executable"
      - name: Record binary SHA-256 and build dependency versions
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            executable="dist/dim-universal-engine.exe"
          else
            executable="dist/dim-universal-engine"
          fi
          python -c 'import hashlib,sys,pathlib; p=pathlib.Path(sys.argv[1]); print("FROZEN_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest()); print("BYTES="+str(p.stat().st_size))' "$executable"
          python -m pip freeze
      - name: Store private CI prototype (not a signed installer)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dim-engine-frozen-fixture-${{ runner.os }}
          path: dist/dim-universal-engine*
          retention-days: 3
          if-no-files-found: error
