name: Source and Release Contracts

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux-source:
    name: linux-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python syntax
        run: python3 -m py_compile build_linux_package.py linux/app/direct_internet_method.py linux/system/selective_dns.py linux/app/router_gateway.py tests/selective_dns_integration_safety_contract.py tests/selective_dns_monitor_lock_contract.py tests/selective_dns_full_lifecycle_mock.py tests/selective_dns_bindings_contract.py tests/selective_dns_backstop_contract.py tests/selective_dns_backstop_runtime_mock.py tests/linux_contract_audit.py tests/linux_user_update_transaction_contract.py linux/app/user_update_transaction.py linux/app/user_uninstall_preserve.py tests/adult_coverage_data_audit.py tests/router_gateway_contract_audit.py tests/router_gateway_runtime_smoke.py tests/rejected_component_audit.py tests/linux_installed_152_lifecycle.py tests/tailscale_coexistence_contract.py tests/tailscale_ui_state_contract.py tests/tailscale_gui_scope_guard_contract.py tests/tailscale_rustdesk_transport_audit.py tests/tailscale_nft_ownership_contract.py tests/tailscale_cleanup_ownership_contract.py tests/tailscale_recovery_missing_state_contract.py tests/nft_presence_fail_closed_contract.py tests/tailscale_transient_rollback_ownership_contract.py tests/linux_nft_kernel_namespace_contract.py tests/linux_mutation_action_lock_contract.py tests/linux_rollback_exit_integrity_contract.py
      - name: Shell syntax and LF guard
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then
              echo "CRLF detected in $f" >&2
              exit 1
            fi
            bash -n "$f"
          done < <(find linux -type f -name '*.sh' -print | sort)
      - name: Linux and Router Gateway contract audits
        run: |
          python3 tests/linux_contract_audit.py
          python3 tests/linux_user_update_transaction_contract.py
          python3 tests/tailscale_coexistence_contract.py
          python3 tests/selective_dns_optin_contract.py
          python3 tests/selective_dns_isolated_runtime.py
          python3 tests/selective_dns_restore_mock_contract.py
          python3 tests/selective_dns_gui_optin_contract.py
          python3 tests/selective_dns_integration_safety_contract.py
          python3 tests/selective_dns_monitor_lock_contract.py
          python3 tests/selective_dns_full_lifecycle_mock.py
          python3 tests/selective_dns_bindings_contract.py
          python3 tests/selective_dns_backstop_contract.py
          python3 tests/selective_dns_backstop_runtime_mock.py
          python3 tests/tailscale_ui_state_contract.py
          python3 tests/tailscale_gui_scope_guard_contract.py
          python3 tests/tailscale_rustdesk_transport_audit.py --selftest
          python3 tests/tailscale_nft_ownership_contract.py
          python3 tests/tailscale_cleanup_ownership_contract.py
          python3 tests/tailscale_recovery_missing_state_contract.py
          python3 tests/nft_presence_fail_closed_contract.py
          python3 tests/tailscale_transient_rollback_ownership_contract.py
          python3 tests/linux_nft_kernel_namespace_contract.py --source-only
          python3 tests/linux_mutation_action_lock_contract.py
          python3 tests/linux_rollback_exit_integrity_contract.py
          python3 tests/adult_coverage_data_audit.py
          python3 tests/router_gateway_contract_audit.py
          python3 tests/release_metadata_audit.py
          python3 tests/release_publication_negative_regression.py
          python3 tests/unsigned_public_release_contract.py --fixtures
          python3 tests/rejected_component_audit.py
      - name: Isolated real-kernel nftables contract
        shell: bash
        run: |
          set -euo pipefail
          # Reject direct execution against the host network namespace.
          # The contract checks an empty isolated loopback-only namespace.
          command -v unshare
          command -v ip
          if ! command -v nft >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y nftables
          fi
          sudo -n python3 tests/linux_nft_kernel_namespace_contract.py --kernel
      - name: Build Linux archive
        run: python3 build_linux_package.py
      - name: Verify exact Linux candidate artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          recorded=json.loads(pathlib.Path("RELEASE.json").read_text(encoding="utf-8"))
          old=recorded["platforms"]["linux"]
          # RELEASE.json is the exact OLD public Preview3 artifact record;
          # it must not be mistaken for this unpromoted new source candidate.
          assert old["sha256"].upper()=="0218BEBD0DC8F88670374FF0E12A61D45229A03092C606678C5C00FD81DC2C9E"
          assert old["artifactSourceCommit"]=="3ead24911ca583932ed8fbcb5820b8a25b20303f"
          p=pathlib.Path(old["artifact"])
          assert p.is_file(), "NEW_CANDIDATE_ARCHIVE_MISSING"
          actual=hashlib.sha256(p.read_bytes()).hexdigest().upper()
          expected="11AC4C957E346FAB7425E8180667ACD88173B01028C3A1B7F49CF10124C0E785"
          assert actual==expected, f"NEW_LINUX_CANDIDATE_SHA_MISMATCH {actual} != {expected}"
          assert p.stat().st_size==8270691, "NEW_LINUX_CANDIDATE_BYTES_WRONG"
          assert actual!=old["sha256"].upper(), "OLD_PUBLIC_ARTIFACT_MISLABELED_AS_NEW"
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None and len(z.namelist())==24
            meta_name=next(x for x in z.namelist() if x.endswith("PACKAGE_MANIFEST.json"))
            manifest=json.loads(z.read(meta_name))
            assert len(manifest["files"])==22
            prefix=meta_name[:-len("PACKAGE_MANIFEST.json")]
            for row in manifest["files"]:
              data=z.read(prefix+row["file"])
              assert len(data)==row["bytes"]
              assert hashlib.sha256(data).hexdigest().upper()==row["sha256"]
          print("PASS EXACT NEW 22-FILE LINUX UPDATE CANDIDATE, OLD PUBLIC PREVIEW UNCHANGED", actual)
          PY
      - name: Validate shell syntax inside built archive
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q delivery/DirectInternetMethod_1.5.2_Linux_x86_64.zip -d "$d"
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then
              echo "CRLF detected in packaged shell: $f" >&2
              exit 1
            fi
            bash -n "$f"
          done < <(find "$d" -type f -name '*.sh' -print | sort)

  windows-source:
    name: windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Python syntax
        shell: pwsh
        run: python -m py_compile tests/windows_contract_audit.py tests/windows_native_scm_stop_contract.py tests/build_windows_manifest.py tests/adult_coverage_data_audit.py tests/router_gateway_contract_audit.py tests/router_gateway_runtime_smoke.py tests/rejected_component_audit.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bad=@()
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors){$bad += $errors}
          }
          if($bad.Count){$bad | Format-List | Out-String | Write-Error}
      - name: Build service
        run: dotnet build windows/service/DirectInternetMethod.Service.csproj -c Release --nologo
      - name: Build GUI
        run: dotnet build windows/gui/DirectInternetMethod.csproj -c Release --nologo
      - name: Restore pinned PowerShell runtime
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File tests/prepare_powershell_runtime.ps1
      - name: Fail-closed public signer and Smart App Control eligibility fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -File tests/windows_public_signer_trust_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Private draft Windows release asset metadata contracts (offline)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -NonInteractive -File tests/windows_release_draft_asset_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Native SCM stopped-state and bounded-stop regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_native_scm_stop_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Full Windows and Router Gateway contract audits
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/adult_coverage_data_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/router_gateway_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/rejected_component_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

  windows-release-contract:
    name: windows-release-contract-unsigned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline unsigned publication negative fixtures and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/release_metadata_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/release_publication_negative_regression.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Verify published unsigned public assets with exact hosted Windows install and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/unsigned_public_release_contract.py --public-tag
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Archive independently verified public release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/DIRECT_R394_PUBLIC_TAG_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30

  windows-installed-qa-r426:
    name: windows-r426-151-to-candidate-preserve-provider-rollback
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit/r426-windows-rollback-preserve-qa-20261012'
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Checkout one-off guarded QA runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout exact product source under candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bd3d28fd14b7c34d4d81c37c763ffa6de90127a4
          path: candidate
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Fail-closed native security and source identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64'){throw 'HOSTED_WINDOWS_ONLY'}
          if($env:GITHUB_REPOSITORY -ne 'GOD13emad/DirectInternetMethod' -or $env:GITHUB_REF -ne 'refs/heads/audit/r426-windows-rollback-preserve-qa-20261012'){throw 'SOURCE_QA_BRANCH_DRIFT'}
          $head=(git -C candidate rev-parse HEAD).Trim()
          if($head -ne 'bd3d28fd14b7c34d4d81c37c763ffa6de90127a4'){throw 'CANDIDATE_SOURCE_SHA_WRONG'}
          $script='tests/R426_QA.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'R426_QA_SCRIPT_SYNTAX_ERROR'}
          & $script -StaticOnly
          if(-not $?){throw 'R426_STATIC_PREFLIGHT_FAILED'}

      - name: Restore pinned native PowerShell runtime in candidate QA
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/prepare_powershell_runtime.ps1
          if($LASTEXITCODE -ne 0){throw 'PINNED_VENDOR_RUNTIME_PREPARE_FAILED'}

      - name: Rebuild exact-source WPF GUI service and manifest
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/build_windows_152_payload.ps1 -PreflightOnly
          & ./tests/build_windows_152_payload.ps1
          if($LASTEXITCODE -ne 0){throw 'EXACT_CANDIDATE_NATIVE_BUILD_FAILED'}

      - name: Compile genuine unsigned candidate Inno on host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $iscc=Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if(!(Test-Path -LiteralPath $iscc)){ $found=Get-Command iscc.exe -ErrorAction SilentlyContinue; if($found){$iscc=$found.Source} }
          if(!(Test-Path -LiteralPath $iscc)){
            choco install innosetup -y --no-progress --limit-output
            if($LASTEXITCODE -ne 0){throw 'NATIVE_INNO_COMPILER_UNAVAILABLE'}
            $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if(!(Test-Path -LiteralPath $iscc)){throw 'NATIVE_INNO_COMPILER_NOT_PRESENT'}
          $output=Join-Path $env:RUNNER_TEMP 'DIM_R426_CANDIDATE'
          if(Test-Path $output){throw 'QA_INSTALLER_OUTPUT_ALREADY_PRESENT'}
          New-Item -Path $output -ItemType Directory -ErrorAction Stop |Out-Null
          & $iscc '/Qp' ('/O'+$output) '/FDirectInternetMethod_1.5.2_Windows_Setup' (Join-Path $root 'windows\installer\DirectInternetMethod.iss')
          if($LASTEXITCODE -ne 0){throw 'R426_INNO_COMPILE_FAILED'}
          $setup=Join-Path $output 'DirectInternetMethod_1.5.2_Windows_Setup.exe'
          if(!(Test-Path $setup -PathType Leaf)){throw 'NATIVE_INNO_OUTPUT_NOT_FOUND'}
          if((Get-AuthenticodeSignature $setup).Status.ToString() -ne 'NotSigned'){throw 'OWNER_UNSIGNED_BUNDLE_STATUS_WRONG'}
          $m=@{
            schema=1;status='PASS_NATIVE_SOURCE_COMPILE_INNO_QA';source='bd3d28fd14b7c34d4d81c37c763ffa6de90127a4'
            setupSHA=(Get-FileHash $setup -Algorithm SHA256).Hash;setupBytes=(Get-Item $setup).Length
            guiSHA=(Get-FileHash (Join-Path $root 'windows\app\DirectInternetMethod.exe') -Algorithm SHA256).Hash
            serviceSHA=(Get-FileHash (Join-Path $root 'windows\app\DirectInternetMethod.Service.exe') -Algorithm SHA256).Hash
            manifestSHA=(Get-FileHash (Join-Path $root 'windows\manifest.json') -Algorithm SHA256).Hash
            nativeCompiler=$iscc;osPolicyChanged=$false
          }
          $p=Join-Path $env:RUNNER_TEMP 'DIM_R426_BUILD.json'
          if(Test-Path $p){throw 'BUILD_RECEIPT_ALREADY_CREATED'}
          [IO.File]::WriteAllText($p,($m|ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
          Write-Output ('R426_REAL_CANDIDATE_SETUP_SHA='+$m.setupSHA)

      - name: Fetch exact published unsigned stable v1.5.1 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'DIM_R426_BASELINE'
          if(Test-Path $dir){throw 'BASELINE_SOURCE_ALREADY_PRESENT'}
          New-Item -Path $dir -ItemType Directory -ErrorAction Stop|Out-Null
          & gh release download v1.5.1 --repo GOD13emad/DirectInternetMethod --pattern 'DirectInternetMethod_1.5.1_Windows_Setup.exe' --dir $dir
          if($LASTEXITCODE -ne 0){throw 'STABLE_INSTALLER_DOWNLOAD_FAILED'}
          $p=Join-Path $dir 'DirectInternetMethod_1.5.1_Windows_Setup.exe'
          if((Get-FileHash $p -Algorithm SHA256).Hash -ne '4E1974B5A40F96B49B7B4196FFE963DCDF65B05E4F2B89DE4EC06E794B77EE9B'){throw 'STABLE_SHA_NOT_PINNED'}

      - name: Real in-place upgrade user-data retention and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'DIM_R426_CANDIDATE\DirectInternetMethod_1.5.2_Windows_Setup.exe'
          $stable=Join-Path $env:RUNNER_TEMP 'DIM_R426_BASELINE\DirectInternetMethod_1.5.1_Windows_Setup.exe'
          & ./tests/R426_QA.ps1 -Installer $installer -BaselineInstaller $stable
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Retain raw installed acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dim-r426-inplace-userdata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DIM_R426_HOSTED
            ${{ runner.temp }}/DIM_R426_BUILD.json
          retention-days: 30
          if-no-files-found: warn
