name: Source and Release Contracts

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux-source:
    name: linux-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Candidate source syntax and shell safety
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q build_linux_package.py linux/app linux/system tests
          while IFS= read -r path; do
            if grep -q $'\r' "$path"; then
              echo "CRLF in candidate shell: $path" >&2
              exit 1
            fi
            bash -n "$path"
          done < <(find linux -type f -name '*.sh' | sort)
      - name: Build deterministic Linux 1.5.5-rc1 package
        run: python3 build_linux_package.py
      - name: Exact candidate SHA and non-release authority gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          p=pathlib.Path("delivery/DirectInternetMethod_1.5.5-rc1_Linux_x86_64.zip")
          expected="45A29A65B3E34302AD8E0745324EC2A1C418BB43669F9B95B15963B02CDFCC49"
          assert p.is_file() and p.stat().st_size==8334126
          assert hashlib.sha256(p.read_bytes()).hexdigest().upper()==expected
          meta=json.loads(pathlib.Path("RELEASE.json").read_text())
          assert meta.get("version")=="1.5.4","PUBLISHED_RELEASE_METADATA_MUST_REMAIN_STABLE"
          with zipfile.ZipFile(p) as z:
            root="DirectInternetMethod_1.5.5-rc1_Linux_x86_64/"
            assert len(z.namelist())==28 and len(z.namelist())==len(set(z.namelist()))
            j=json.loads(z.read(root+"PACKAGE_MANIFEST.json"))
            assert j["version"]=="1.5.5-rc1" and len(j["files"])==26
            for x in j["files"]:
              data=z.read(root+x["file"])
              assert len(data)==x["bytes"]
              assert hashlib.sha256(data).hexdigest().upper()==x["sha256"]
            assert z.testzip() is None
          print("R520_EXACT_155RC1_PACKAGE_AND_PUBLIC_V154_AUTHORITY_PASS",expected)
          PY
      - name: Negative-first R519 candidate package and protected upgrade
        run: |
          set -euo pipefail
          python3 -B tests/r519_versioned_package_contract.py
          python3 -B tests/protected_upgrade_transaction_contract.py
          python3 -B tests/r519_user_update_transaction_contract.py
      - name: R526 Linux installer metadata activation (hermetic fake Root)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/r526_installer_metadata_contract.py
      - name: R527 privileged Root files on disposable GitHub Ubuntu VM
        shell: bash
        run: |
          set -euo pipefail
          # Real UID 0 on a fresh hosted VM; product writes only inside test-owned workspace fixture.
          # The production Root CLI and real host network/systemd are never invoked.
          sudo -n /usr/bin/env CI=true GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -B tests/r527_privileged_root_transaction_contract.py
      - name: R517 encrypted DNS and Tailscale negative-first contracts
        run: |
          set -euo pipefail
          python3 -B tests/encrypted_selective_dns_policy_contract.py
          python3 -B tests/encrypted_selective_dns_controller_contract.py
          python3 -B tests/encrypted_selective_dns_fake_lifecycle.py
          python3 -B tests/encrypted_selective_dns_gui_consent_contract.py
          python3 -B tests/encrypted_selective_dns_integration_contract.py
          python3 -B tests/tailscale_coexistence_contract.py
          python3 -B tests/selective_dns_optin_contract.py
      - name: Package embedded shell and source-mode integrity
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q delivery/DirectInternetMethod_1.5.5-rc1_Linux_x86_64.zip -d "$d"
          while IFS= read -r f; do
            bash -n "$f"
            if grep -q $'\r' "$f"; then
              echo "UNSAFE_PACKAGE_CRLF:$f" >&2
              exit 1
            fi
          done < <(find "$d" -type f -name '*.sh' | sort)

  linux-native-root-ephemeral:
    name: linux-native-root-ephemeral
    needs: linux-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild exact RC1 package
        run: python3 build_linux_package.py
      - name: Download byte-pinned published Stable v1.5.4 package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          curl --fail --show-error --silent --location --retry 3 --max-time 120 \
            'https://github.com/GOD13emad/DirectInternetMethod/releases/download/v1.5.4/DirectInternetMethod_1.5.4_Linux_x86_64.zip' \
            --output "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          printf '%s  %s\n' '4784fcd44ed3d1b40103bca140b2c0066784f794d07c3ae1f525334766a553c7' "$RUNNER_TEMP/DIM_R528_STABLE.zip" | sha256sum --check --status
      - name: R528 true root CLI stage apply rollback on disposable VM
        shell: bash
        run: |
          set -euo pipefail
          # This job starts with an empty DIM root and cannot execute on a personal machine.
          # All absolute-root writes occur inside the disposable GH-hosted Ubuntu VM only.
          sudo -n /usr/bin/env CI=true GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -B tests/r528_ephemeral_native_root_cli_contract.py

  linux-root-user-integrated-ephemeral:
    name: linux-root-user-integrated-ephemeral
    needs: linux-native-root-ephemeral
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and independently pin candidate package
        shell: bash
        run: |
          set -euo pipefail
          python3 build_linux_package.py
          printf '%s  %s\n' '45a29a65b3e34302ad8e0745324ec2a1c418bb43669f9b95b15963b02cdfcc49' 'delivery/DirectInternetMethod_1.5.5-rc1_Linux_x86_64.zip' | sha256sum --check --status
      - name: Download and independently pin official Stable 1.5.4 package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          curl --fail --show-error --silent --location --retry 3 --max-time 120 \
            'https://github.com/GOD13emad/DirectInternetMethod/releases/download/v1.5.4/DirectInternetMethod_1.5.4_Linux_x86_64.zip' \
            --output "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          printf '%s  %s\n' '4784fcd44ed3d1b40103bca140b2c0066784f794d07c3ae1f525334766a553c7' "$RUNNER_TEMP/DIM_R528_STABLE.zip" | sha256sum --check --status
      - name: R529 actual Root and unprivileged User transaction with rollback
        shell: bash
        run: |
          set -euo pipefail
          # Fresh GitHub VM only; no real host services, DNS, GUI or Tailscale touched.
          sudo -n /usr/bin/env CI=true GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -B tests/r529_ephemeral_root_user_transaction.py

  linux-independent-root-watchdog-ephemeral:
    name: linux-independent-root-watchdog-ephemeral
    needs: linux-root-user-integrated-ephemeral
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild exact candidate Linux archive and pin identity
        shell: bash
        run: |
          set -euo pipefail
          python3 build_linux_package.py
          printf '%s  %s\n' '45a29a65b3e34302ad8e0745324ec2a1c418bb43669f9b95b15963b02cdfcc49' 'delivery/DirectInternetMethod_1.5.5-rc1_Linux_x86_64.zip' | sha256sum --check --status
      - name: Download byte-pinned published Stable v1.5.4 archive
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          curl --fail --show-error --silent --location --retry 3 --max-time 120 \
            'https://github.com/GOD13emad/DirectInternetMethod/releases/download/v1.5.4/DirectInternetMethod_1.5.4_Linux_x86_64.zip' \
            --output "$RUNNER_TEMP/DIM_R528_STABLE.zip"
          printf '%s  %s\n' '4784fcd44ed3d1b40103bca140b2c0066784f794d07c3ae1f525334766a553c7' "$RUNNER_TEMP/DIM_R528_STABLE.zip" | sha256sum --check --status
      - name: Arm independent root-owned systemd watchdog before two-sided mutation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env CI=true GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -B tests/r532_ephemeral_root_watchdog_contract.py arm
      - name: Independent process verifies timed root and user rollback after arm exits
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env CI=true GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -B tests/r532_ephemeral_root_watchdog_contract.py verify

  linux-public-v154-regression:
    name: linux-public-v154-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 51009372e3c2d069d7016b97773f35ee5e1e0631
      - name: Preserve original stable Linux contracts at exact tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "51009372e3c2d069d7016b97773f35ee5e1e0631"
          python3 -B tests/linux_contract_audit.py
          python3 -B tests/linux_user_update_transaction_contract.py
          python3 -B tests/selective_dns_optin_contract.py
          python3 -B tests/selective_dns_gui_optin_contract.py
          python3 -B tests/selective_dns_integration_safety_contract.py
          python3 -B tests/tailscale_coexistence_contract.py
          python3 -B tests/release_metadata_audit.py
          python3 build_linux_package.py
          python3 -B tests/linux_real_extracted_archive_contract.py

  windows-source:
    name: windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail closed on dirty Windows checkout (tracked sources)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") { throw "WINDOWS_CHECKOUT_SHA_DRIFT" }
          $dirty=@(git status --porcelain=v1 --untracked-files=no)
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Error "UNEXPECTED_TRACKED_CHECKOUT_MUTATION: $_" }
            throw "WINDOWS_CHECKOUT_DIRTY_FAIL_CLOSED"
          }
          $eol=(git ls-files --eol -- windows/installer/DirectInternetMethod.iss)
          if ($eol -notmatch 'attr/-text') { throw "INNO_MIXED_EOL_BYTE_PRESERVATION_MISSING" }
          Write-Output "PASS_R465_WINDOWS_SOURCE_CHECKOUT_CLEAN_AND_PINNED"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: R482 fail-closed .NET 10 WPF and Service migration contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/dotnet10_target_contract.py
          if($LASTEXITCODE -ne 0){throw 'R482_NET10_FRAMEWORK_CONTRACT_FAILED'}
      - name: Verify published v1.5.4 documentation is current
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/current_public_docs_contract_154.py
          if($LASTEXITCODE -ne 0){throw 'R497_PUBLIC_DOCS_REGRESSION'}
      - name: Python syntax
        shell: pwsh
        run: python -m py_compile tests/windows_legacy_151_stage_finalize_contract.py tests/windows_contract_audit.py tests/windows_native_scm_stop_contract.py tests/build_windows_manifest.py tests/adult_coverage_data_audit.py tests/router_gateway_contract_audit.py tests/router_gateway_runtime_smoke.py tests/rejected_component_audit.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bad=@()
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors){$bad += $errors}
          }
          if($bad.Count){$bad | Format-List | Out-String | Write-Error}
      - name: Build service
        run: dotnet build windows/service/DirectInternetMethod.Service.csproj -c Release --nologo
      - name: Build GUI
        run: dotnet build windows/gui/DirectInternetMethod.csproj -c Release --nologo
      - name: Restore pinned PowerShell runtime
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File tests/prepare_powershell_runtime.ps1
      - name: Fail-closed public signer and Smart App Control eligibility fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -File tests/windows_public_signer_trust_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Private draft Windows release asset metadata contracts (offline)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -NonInteractive -File tests/windows_release_draft_asset_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Native SCM stopped-state and bounded-stop regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_native_scm_stop_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Full Windows and Router Gateway contract audits
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_legacy_151_stage_finalize_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/windows_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/adult_coverage_data_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/router_gateway_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/rejected_component_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Verify raw Linux proof negative fixtures for v1.5.3 tag
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/unsigned_public_release_contract_153.py --fixtures
          if($LASTEXITCODE -ne 0){throw 'R474_PUBLIC_VERIFIER_NEGATIVE_FIXTURES_FAILED'}

      - name: Verify v1.5.4 four-hosted public-release negative fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/unsigned_public_release_contract_154.py --fixtures
          if($LASTEXITCODE -ne 0){throw 'R492_PUBLIC_V154_NEGATIVE_FIXTURES_FAILED'}

  windows-private-r535-native:
    name: windows-private-r535-native
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/r535-windows-155rc1' || github.ref == 'refs/heads/feature/r520-linux-155rc1-ci')
    needs: windows-source
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: R535 build exact private 1.5.5-rc1 Windows GUI service Inno installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -NonInteractive -File tests/r535_windows_candidate_hosted_build.ps1
          if($LASTEXITCODE -ne 0){throw 'R535_PRIVATE_WINDOWS_NATIVE_BUILD_FAILED'}
      - name: R535 hosted Windows v1.5.4 to RC1 in-place upgrade preserve and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -NonInteractive -File tests/r535_windows_native_rollback.ps1
          if($LASTEXITCODE -ne 0){throw 'R535_NATIVE_INSTALL_ROLLBACK_FAILED'}
      - name: Preserve R535 private verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r535-windows-rc1-hosted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DIM_R535_NATIVE/BUILD_R535.json
            ${{ runner.temp }}/DIM_R535_NATIVE/NATIVE_R535.json
          if-no-files-found: warn
          retention-days: 14

  windows-release-contract:
    name: windows-release-contract-unsigned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline unsigned publication negative fixtures and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/release_metadata_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/release_publication_negative_regression.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract_153.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract_154.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Verify published unsigned public assets with exact hosted Windows install and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF -eq 'refs/tags/v1.5.4'){
            python -B tests/unsigned_public_release_contract_154.py --public-tag
          } elseif($env:GITHUB_REF -eq 'refs/tags/v1.5.3'){
            python -B tests/unsigned_public_release_contract_153.py --public-tag
          } else {
            python -B tests/unsigned_public_release_contract.py --public-tag
          }
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Archive independently verified public release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DIRECT_R394_PUBLIC_TAG_VERIFICATION.json
            ${{ runner.temp }}/DIRECT_R472_V153_PUBLIC_TAG_VERIFICATION.json
            ${{ runner.temp }}/DIM_R492_PUBLIC_TAG/PUBLIC_TAG_R492_RESULT.json
          if-no-files-found: warn
          retention-days: 30
