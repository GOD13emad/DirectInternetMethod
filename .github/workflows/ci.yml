name: Source and Release Contracts

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux-source:
    name: linux-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python syntax
        run: python3 -m py_compile build_linux_package.py linux/app/direct_internet_method.py linux/system/selective_dns.py linux/app/router_gateway.py tests/selective_dns_integration_safety_contract.py tests/selective_dns_monitor_lock_contract.py tests/selective_dns_full_lifecycle_mock.py tests/selective_dns_bindings_contract.py tests/selective_dns_backstop_contract.py tests/selective_dns_backstop_runtime_mock.py tests/linux_contract_audit.py tests/linux_user_update_transaction_contract.py tests/linux_real_extracted_archive_contract.py linux/app/user_update_transaction.py linux/app/user_uninstall_preserve.py tests/adult_coverage_data_audit.py tests/router_gateway_contract_audit.py tests/router_gateway_runtime_smoke.py tests/rejected_component_audit.py tests/linux_installed_152_lifecycle.py tests/tailscale_coexistence_contract.py tests/tailscale_ui_state_contract.py tests/tailscale_gui_scope_guard_contract.py tests/tailscale_rustdesk_transport_audit.py tests/tailscale_nft_ownership_contract.py tests/tailscale_cleanup_ownership_contract.py tests/tailscale_recovery_missing_state_contract.py tests/nft_presence_fail_closed_contract.py tests/tailscale_transient_rollback_ownership_contract.py tests/linux_nft_kernel_namespace_contract.py tests/linux_mutation_action_lock_contract.py tests/linux_rollback_exit_integrity_contract.py
      - name: Shell syntax and LF guard
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then
              echo "CRLF detected in $f" >&2
              exit 1
            fi
            bash -n "$f"
          done < <(find linux -type f -name '*.sh' -print | sort)
      - name: Linux and Router Gateway contract audits
        run: |
          python3 tests/linux_contract_audit.py
          python3 tests/linux_user_update_transaction_contract.py
          python3 tests/tailscale_coexistence_contract.py
          python3 tests/selective_dns_optin_contract.py
          python3 tests/selective_dns_isolated_runtime.py
          python3 tests/selective_dns_restore_mock_contract.py
          python3 tests/selective_dns_gui_optin_contract.py
          python3 tests/selective_dns_integration_safety_contract.py
          python3 tests/selective_dns_monitor_lock_contract.py
          python3 tests/selective_dns_full_lifecycle_mock.py
          python3 tests/selective_dns_bindings_contract.py
          python3 tests/selective_dns_backstop_contract.py
          python3 tests/selective_dns_backstop_runtime_mock.py
          python3 tests/tailscale_ui_state_contract.py
          python3 tests/tailscale_gui_scope_guard_contract.py
          python3 tests/tailscale_rustdesk_transport_audit.py --selftest
          python3 tests/tailscale_nft_ownership_contract.py
          python3 tests/tailscale_cleanup_ownership_contract.py
          python3 tests/tailscale_recovery_missing_state_contract.py
          python3 tests/nft_presence_fail_closed_contract.py
          python3 tests/tailscale_transient_rollback_ownership_contract.py
          python3 tests/linux_nft_kernel_namespace_contract.py --source-only
          python3 tests/linux_mutation_action_lock_contract.py
          python3 tests/linux_rollback_exit_integrity_contract.py
          python3 tests/adult_coverage_data_audit.py
          python3 tests/router_gateway_contract_audit.py
          python3 tests/release_metadata_audit.py
          python3 tests/release_publication_negative_regression.py
          python3 tests/unsigned_public_release_contract.py --fixtures
          python3 tests/rejected_component_audit.py
      - name: Isolated real-kernel nftables contract
        shell: bash
        run: |
          set -euo pipefail
          # Reject direct execution against the host network namespace.
          # The contract checks an empty isolated loopback-only namespace.
          command -v unshare
          command -v ip
          if ! command -v nft >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y nftables
          fi
          sudo -n python3 tests/linux_nft_kernel_namespace_contract.py --kernel
      - name: Build Linux archive
        run: python3 build_linux_package.py
      - name: Validate real extracted ZIP transaction and user-data rollback
        run: python3 -B tests/linux_real_extracted_archive_contract.py
      - name: Verify exact Linux candidate artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          recorded=json.loads(pathlib.Path("RELEASE.json").read_text(encoding="utf-8"))
          old=recorded["platforms"]["linux"]
          # RELEASE.json pins the R467 unpublished new candidate artifact;
          # a local build alone is NOT a public installed acceptance or permission to publish.
          assert old["sha256"].upper()=="4784FCD44ED3D1B40103BCA140B2C0066784F794D07C3AE1F525334766A553C7"
          assert recorded["version"]=="1.5.4" and recorded["status"]=="CANDIDATE_V154_UNPUBLISHED_UNPROVEN"
          p=pathlib.Path(old["artifact"])
          assert p.is_file(), "NEW_CANDIDATE_ARCHIVE_MISSING"
          actual=hashlib.sha256(p.read_bytes()).hexdigest().upper()
          expected="4784FCD44ED3D1B40103BCA140B2C0066784F794D07C3AE1F525334766A553C7"
          assert actual==expected, f"NEW_LINUX_CANDIDATE_SHA_MISMATCH {actual} != {expected}"
          assert p.stat().st_size==8270220, "NEW_LINUX_CANDIDATE_BYTES_WRONG"
          assert actual==old["sha256"].upper(), "R467_CANDIDATE_SOURCE_DIGEST_MISMATCH"
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None and len(z.namelist())==24
            meta_name=next(x for x in z.namelist() if x.endswith("PACKAGE_MANIFEST.json"))
            manifest=json.loads(z.read(meta_name))
            assert len(manifest["files"])==22
            prefix=meta_name[:-len("PACKAGE_MANIFEST.json")]
            for row in manifest["files"]:
              data=z.read(prefix+row["file"])
              assert len(data)==row["bytes"]
              assert hashlib.sha256(data).hexdigest().upper()==row["sha256"]
          print("PASS R486 VERSIONED DOTNET10 LINUX CANDIDATE, V152 PUBLIC HISTORICAL UNCHANGED", actual)
          PY
      - name: Validate shell syntax inside built archive
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q delivery/DirectInternetMethod_1.5.4_Linux_x86_64.zip -d "$d"
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then
              echo "CRLF detected in packaged shell: $f" >&2
              exit 1
            fi
            bash -n "$f"
          done < <(find "$d" -type f -name '*.sh' -print | sort)

  windows-source:
    name: windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail closed on dirty Windows checkout (tracked sources)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.sha }}") { throw "WINDOWS_CHECKOUT_SHA_DRIFT" }
          $dirty=@(git status --porcelain=v1 --untracked-files=no)
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Error "UNEXPECTED_TRACKED_CHECKOUT_MUTATION: $_" }
            throw "WINDOWS_CHECKOUT_DIRTY_FAIL_CLOSED"
          }
          $eol=(git ls-files --eol -- windows/installer/DirectInternetMethod.iss)
          if ($eol -notmatch 'attr/-text') { throw "INNO_MIXED_EOL_BYTE_PRESERVATION_MISSING" }
          Write-Output "PASS_R465_WINDOWS_SOURCE_CHECKOUT_CLEAN_AND_PINNED"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: R482 fail-closed .NET 10 WPF and Service migration contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/dotnet10_target_contract.py
          if($LASTEXITCODE -ne 0){throw 'R482_NET10_FRAMEWORK_CONTRACT_FAILED'}
      - name: Python syntax
        shell: pwsh
        run: python -m py_compile tests/windows_legacy_151_stage_finalize_contract.py tests/windows_contract_audit.py tests/windows_native_scm_stop_contract.py tests/build_windows_manifest.py tests/adult_coverage_data_audit.py tests/router_gateway_contract_audit.py tests/router_gateway_runtime_smoke.py tests/rejected_component_audit.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bad=@()
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors){$bad += $errors}
          }
          if($bad.Count){$bad | Format-List | Out-String | Write-Error}
      - name: Build service
        run: dotnet build windows/service/DirectInternetMethod.Service.csproj -c Release --nologo
      - name: Build GUI
        run: dotnet build windows/gui/DirectInternetMethod.csproj -c Release --nologo
      - name: Restore pinned PowerShell runtime
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File tests/prepare_powershell_runtime.ps1
      - name: Fail-closed public signer and Smart App Control eligibility fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -File tests/windows_public_signer_trust_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Private draft Windows release asset metadata contracts (offline)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh.exe -NoProfile -NonInteractive -File tests/windows_release_draft_asset_contract.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Native SCM stopped-state and bounded-stop regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_native_scm_stop_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Full Windows and Router Gateway contract audits
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/windows_legacy_151_stage_finalize_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/windows_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/adult_coverage_data_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/router_gateway_contract_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/rejected_component_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Verify raw Linux proof negative fixtures for v1.5.3 tag
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/unsigned_public_release_contract_153.py --fixtures
          if($LASTEXITCODE -ne 0){throw 'R474_PUBLIC_VERIFIER_NEGATIVE_FIXTURES_FAILED'}

  windows-release-contract:
    name: windows-release-contract-unsigned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline unsigned publication negative fixtures and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B tests/release_metadata_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/release_publication_negative_regression.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python -B tests/unsigned_public_release_contract_153.py --fixtures
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Verify published unsigned public assets with exact hosted Windows install and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF -eq 'refs/tags/v1.5.3'){
            python -B tests/unsigned_public_release_contract_153.py --public-tag
          } else {
            python -B tests/unsigned_public_release_contract.py --public-tag
          }
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Archive independently verified public release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DIRECT_R394_PUBLIC_TAG_VERIFICATION.json
            ${{ runner.temp }}/DIRECT_R472_V153_PUBLIC_TAG_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
  windows-hosted-r488-legacy-update:
    name: windows-r488-native-legacy-v151-stage-acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/r488-v154-exact-draft-20261013'
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout guarded QA code from exact requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact accepted main source into candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: daf1a939c97f38d4ecec1f8144dd754a2d392c99
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.401'
      - name: Preflight exact source and disposable machine only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64'){throw 'R488_HOSTED_DISPOSABLE_ONLY'}
          if($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REPOSITORY -ne 'GOD13emad/DirectInternetMethod' -or $env:GITHUB_REF -ne 'refs/heads/qa/r488-v154-exact-draft-20261013'){throw 'R488_UNAUTHORIZED_RUN_CONTEXT'}
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'R488_QA_HEAD_DRIFT'}
          if((git -C candidate rev-parse HEAD).Trim() -ne 'daf1a939c97f38d4ecec1f8144dd754a2d392c99'){throw 'R488_PRODUCT_SOURCE_DRIFT'}
          $test='tests/R488_NATIVE_NET10.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($test,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R488_PARSER_FAIL'}
          $s=Get-Content -LiteralPath $test -Raw
          foreach($anchor in @("DirectInternetMethod_1.5.4_Windows_Setup.exe","tag='v1.5.4'",'updaterPendingCleared','networkRestoredExact','oneUninstallerRecorded')){
            if(!$s.Contains($anchor)){throw ('R488_CRITICAL_TEST_ANCHOR_MISSING_'+$anchor)}
          }
          $h=(Get-FileHash 'candidate/windows/app/SafeLegacyProviderRollback.ps1' -Algorithm SHA256).Hash
          if($h -ne '522D78CB2A40A917B4E86DD7F98F4D3B076FD8A551B97C4B0C211FDFC7D9B322'){throw 'ROLLBACK_HELPER_SHA_DRIFT'}
          & $test -StaticOnly
          if(!$?){throw 'R488_STATIC_GUARD_FAIL'}
          Write-Output 'PASS_R488_HOSTED_PRESTATE'
      - name: Verify legacy source security contract before build
        working-directory: candidate
        shell: pwsh
        run: |
          python -B tests/windows_legacy_151_stage_finalize_contract.py
          if($LASTEXITCODE -ne 0){throw 'R488_LEGACY_PATH_GUARDS_FAIL'}
          python -B tests/windows_native_scm_stop_contract.py
          if($LASTEXITCODE -ne 0){throw 'R488_NATIVE_SCM_GUARDS_FAIL'}
      - name: Download and SHA attest EXACT private GitHub v1.5.4 draft Windows Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='GOD13emad/DirectInternetMethod'
          $head='daf1a939c97f38d4ecec1f8144dd754a2d392c99'
          $expectedSetup='FFB9A2AE19C2E89338EE12EE8DA133F5A16DBF4DCF961678C33D77D0C3843133'
          $expectedZip='4784FCD44ED3D1B40103BCA140B2C0066784F794D07C3AE1F525334766A553C7'
          $expectedSums='68E70329E8B9DAC6B738CE9B90D99A0010030980CD9C17CDE45A5199A60692D8'
          $win='DirectInternetMethod_1.5.4_Windows_Setup.exe'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:GITHUB_REF -ne 'refs/heads/qa/r488-v154-exact-draft-20261013'){throw 'R488_HOST_REF_NOT_DISPOSABLE_QA'}
          if((git -C candidate rev-parse HEAD).Trim() -ne $head){throw 'R488_PRODUCT_SOURCE_DRIFT'}
          $raw=(& gh api ('repos/'+$repo+'/releases/412071526')|Out-String)
          if($LASTEXITCODE -ne 0 -or !$raw.Trim()){throw 'R488_DRAFT_METADATA_NOT_READABLE'}
          $rel=$raw|ConvertFrom-Json
          if($rel.id -ne 412071526 -or $rel.tag_name -cne 'v1.5.4' -or $rel.draft -ne $true -or $rel.prerelease -ne $false -or $rel.target_commitish -cne $head){throw 'R488_PRIVATE_RELEASE_IDENTITY_WRONG'}
          $wanted=@{
            'DirectInternetMethod_1.5.4_Windows_Setup.exe'='sha256:'+$expectedSetup
            'DirectInternetMethod_1.5.4_Linux_x86_64.zip'='sha256:'+$expectedZip
            'SHA256SUMS.txt'='sha256:'+$expectedSums
            'cygwin-3.4.10-1-src.tar.xz'='sha256:AC70AF0D4E644732F74946F55F7BAFE010BAB9B9DA39A9327C3F0367F1FA43A2'
            'WinDivert-v2.2.2-corresponding-source.zip'='sha256:65EC79C9E6AFA99F648A3F4D1F6DB794640B40D0B65BD438770EA503EE14ECB7'
          }
          if(@($rel.assets).Count -ne $wanted.Count){throw 'R488_DRAFT_ASSET_COUNT_WRONG'}
          foreach($name in $wanted.Keys){
            $found=@($rel.assets |Where-Object {$_.name -ceq $name})
            if($found.Count -ne 1 -or [string]$found[0].digest -ine $wanted[$name] -or $found[0].state -ne 'uploaded'){throw ('R488_DRAFT_ASSET_DIGEST_'+$name)}
          }
          $stage=Join-Path $env:RUNNER_TEMP 'DIM_R488_CANDIDATE'
          if(Test-Path -LiteralPath $stage){throw 'R488_STAGING_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop|Out-Null
          & gh release download v1.5.4 --repo $repo --pattern $win --dir $stage
          if($LASTEXITCODE -ne 0){throw 'R488_EXACT_WIN_DOWNLOAD_FAILED'}
          & gh release download v1.5.4 --repo $repo --pattern 'SHA256SUMS.txt' --dir $stage
          if($LASTEXITCODE -ne 0){throw 'R488_EXACT_SUMS_DOWNLOAD_FAILED'}
          $setup=Join-Path $stage $win
          $sums=Join-Path $stage 'SHA256SUMS.txt'
          if((Get-Item $setup).Length -ne 154270907 -or (Get-FileHash $setup -Algorithm SHA256).Hash -ne $expectedSetup){throw 'R488_EXECUTABLE_BYTES_NOT_RELEASE_ASSET'}
          if((Get-Item $sums).Length -ne 221 -or (Get-FileHash $sums -Algorithm SHA256).Hash -ne $expectedSums){throw 'R488_CHECKSUM_FILE_BYTES'}
          $lines=@([IO.File]::ReadAllLines($sums)|Where-Object {$_})
          if($lines.Count -ne 2 -or $lines -notcontains ($expectedSetup+'  '+$win) -or $lines -notcontains ($expectedZip+'  DirectInternetMethod_1.5.4_Linux_x86_64.zip')){throw 'R488_CHECKSUM_FILE_CONTENT'}
          if((Get-AuthenticodeSignature $setup).Status.ToString() -ne 'NotSigned'){throw 'R488_OWNER_UNSIGNED_DISTRIBUTION_POLICY_CHANGED'}
          $receipt=[ordered]@{
            schema=1;status='PASS_EXACT_V154_PRIVATE_DRAFT_SHA'
            source=$head;setupSHA=$expectedSetup;setupBytes=[int64]154270907
            guiSHA='BE9C78C0B5C007B4A46480D423079C219006B730D9589279AA466B0F14BCF00F'
            serviceSHA='2AE7EA11A94BFA3187BC7CDF63A37CB5CD5B55C313C3966330FD280ECC9ECE41'
            manifestSHA='9BF9CBAC2588484DD237559CB0F1FA7D343BE52ABEFC07963BCB3654F51BCD6F'
            origin='R488_EXACT_PRIVATE_GITHUB_RELEASE_ASSET';releaseId=[int]412071526
            touchedOwnerHosts=$false;networkSecurityChanged=$false
          }
          $file=Join-Path $env:RUNNER_TEMP 'DIM_R488_BUILD.json'
          if(Test-Path -LiteralPath $file){throw 'R488_BUILD_RECEIPT_COLLISION'}
          [IO.File]::WriteAllText($file,($receipt|ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
          Write-Output ('PASS_R488_PRIVATE_DRAFT_WIN_SHA='+$expectedSetup)
      - name: Download SHA-attested immutable v1.5.1 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'DIM_R488_BASELINE'
          if(Test-Path $dir){throw 'R488_BASELINE_ALREADY_EXISTS'}
          New-Item $dir -ItemType Directory -ErrorAction Stop|Out-Null
          & gh release download v1.5.1 --repo GOD13emad/DirectInternetMethod --pattern 'DirectInternetMethod_1.5.1_Windows_Setup.exe' --dir $dir
          if($LASTEXITCODE -ne 0){throw 'R488_OFFICIAL_V151_DOWNLOAD_FAIL'}
          $setup=Join-Path $dir 'DirectInternetMethod_1.5.1_Windows_Setup.exe'
          if((Get-Item $setup).Length -ne 157111497 -or (Get-FileHash $setup -Algorithm SHA256).Hash -ne '4E1974B5A40F96B49B7B4196FFE963DCDF65B05E4F2B89DE4EC06E794B77EE9B'){throw 'R488_V151_SHA_SIZE_MISMATCH'}
      - name: Genuine disposable native in-place upgrade and complete rollback
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'DIM_R488_CANDIDATE\DirectInternetMethod_1.5.4_Windows_Setup.exe'
          $old=Join-Path $env:RUNNER_TEMP 'DIM_R488_BASELINE\DirectInternetMethod_1.5.1_Windows_Setup.exe'
          & ./tests/R488_NATIVE_NET10.ps1 -Installer $setup -BaselineInstaller $old
          if($LASTEXITCODE -ne 0){throw ('R488_REAL_VM_INSTALL_ROLLBACK_FAILED_'+$LASTEXITCODE)}
          $p=Join-Path $env:RUNNER_TEMP 'DIM_R488_HOSTED\REPORT_R488.json'
          if(!(Test-Path $p)){throw 'R488_RAW_REPORT_ABSENT'}
          $x=Get-Content $p -Raw|ConvertFrom-Json
          if([string]$x.status -notlike 'PASS_*' -or @($x.errors).Count -ne 0 -or !$x.updaterPendingCleared -or !$x.userDataAfterUpgrade -or !$x.userDataAfterUninstall -or !$x.userDataAfterRestore -or !$x.oneUninstallerRecorded -or !$x.networkRestoredExact -or !$x.watchdogDisarmed -or !$x.guiWindowObserved -or !$x.restored151OriginalHashes){throw 'R488_NATIVE_LIFECYCLE_NOT_ACCEPTED'}
          Write-Output ('R488_HOSTED_REAL_LEGACY_FINALIZE_PASS RAW_SHA256='+(Get-FileHash $p -Algorithm SHA256).Hash)
      - name: Persist raw disposable-VM receipts on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dim-r488-hosted-legacy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/DIM_R488_HOSTED
            ${{ runner.temp }}/DIM_R488_BUILD.json
                      retention-days: 30
          if-no-files-found: warn
