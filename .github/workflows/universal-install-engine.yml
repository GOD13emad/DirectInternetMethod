name: Universal Installation Engine (isolated contract)

on:
  pull_request:
    paths:
      - 'installer_engine/**'
      - 'tests/test_engine*.py'
      - '.github/workflows/universal-install-engine.yml'
      - 'tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py'
  push:
    branches:
      - feature/universal-install-engine
    paths:
      - 'installer_engine/**'
      - 'tests/test_engine*.py'
      - '.github/workflows/universal-install-engine.yml'
      - 'tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-kernel:
    name: Engine / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: dim-universal-engine-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 ref verified 2026-11-20
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated contract + crash/rollback tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_engine*.py -v

  linux-root-owned-fd-probe:
    name: Linux / root-owned fd + synthetic broker policy fixture
    # No untrusted PR checkout is launched under sudo; the only elevated
    # commands create/mode/retire one isolated synthetic fixture directory.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/universal-install-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python (no sudo Python execution)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Root-owned fixture + negative ACL + descriptor-pinned bytes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # Executing a nested script by path replaces sys.path[0] with its
          # subdirectory. Make this checked-out, trusted feature-push source
          # available to the NON-ROOT fixture process explicitly.
          PYTHONPATH: '.'
        run: |
          set -euo pipefail
          fixture='/usr/local/share/dim-r898-ci-protected-fd-fixture'
          marker="$fixture/marker.txt"
          policy="$fixture/synthetic-broker-policy.json"
          ledger="$fixture/synthetic-broker-journal.json"
          emitted="$RUNNER_TEMP/dim-r899-synthetic-broker-policy.json"
          emitted_ledger="$RUNNER_TEMP/dim-r902-synthetic-broker-journal.json"
          if [[ -e "$fixture" || -L "$fixture" ]]; then
            echo 'FOREIGN_FIXTURE_ROOT_EXISTS'
            exit 2
          fi
          sudo install -d -o root -g root -m 0755 "$fixture"
          cleanup() {
            sudo rm -f -- "$marker" "$policy" "$ledger"
            sudo rmdir -- "$fixture"
            rm -f -- "$emitted" "$emitted_ledger"
          }
          trap cleanup EXIT
          printf 'DIM-R898-SYNTHETIC-ROOT-MARKER\n' | sudo tee "$marker" >/dev/null
          sudo chmod 0644 "$marker"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from installer_engine.linux_trusted_fd import TrustedLinuxRootFD
          fixture=Path('/usr/local/share/dim-r898-ci-protected-fd-fixture')
          content=b'DIM-R898-SYNTHETIC-ROOT-MARKER\n'
          with TrustedLinuxRootFD(fixture) as directory:
              got=directory.read_pinned_member('marker.txt',
                  hashlib.sha256(content).hexdigest(),len(content))
          assert got['native_installation_accepted'] is False
          assert got['publisher_authenticated'] is False
          assert got['bytes'] == len(content)
          print('R898_HOSTED_ROOT_OWNED_FD_READONLY_PASS')
          PY
          # The same read-only root FD now carries a bounded synthetically
          # pinned policy into the cross-platform broker-intent validator.
          # The external policy pin here is generated by this fixture, NOT
          # independently authenticated publisher/update authority.
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py emit-synthetic-policy > "$emitted"
          sudo install -o root -g root -m 0644 "$emitted" "$policy"
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py verify-root-policy --fixture-root "$fixture"
          sudo chmod 0666 "$policy"
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py reject-unsafe-policy --fixture-root "$fixture"
          sudo chmod 0644 "$policy"
          # Both synthetic roots must be distinct, real OS-root-owned,
          # non-writable files opened from one trusted directory FD. Read
          # and compare the independently pinned policy + replay snapshot.
          # The CI fixture's self-generated hashes are NOT publisher pins.
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py emit-synthetic-ledger > "$emitted_ledger"
          sudo install -o root -g root -m 0644 "$emitted_ledger" "$ledger"
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py verify-root-snapshot --fixture-root "$fixture"
          sudo chmod 0666 "$ledger"
          python tools/native_fixtures/linux/RunPinnedBrokerPolicyFixture.py reject-unsafe-ledger --fixture-root "$fixture"
          sudo chmod 0644 "$ledger"
          # Linux enforces directory write modes. A root-owned leaf is NOT
          # trusted if group/other write can replace the pinned member.
          sudo chmod 0777 "$fixture"
          python - <<'PY'
          from pathlib import Path
          from installer_engine.engine import EngineError
          from installer_engine.linux_trusted_fd import TrustedLinuxRootFD
          fixture=Path('/usr/local/share/dim-r898-ci-protected-fd-fixture')
          try:
              with TrustedLinuxRootFD(fixture):
                  raise RuntimeError('UNTRUSTED_ROOT_ACL_WAS_ACCEPTED')
          except EngineError as err:
              if 'TRUSTED_FD_UNSAFE_DIRECTORY_COMPONENT' not in str(err):
                  raise
          print('R898_HOSTED_INSECURE_ROOT_DACL_REFUSED')
          PY
          sudo chmod 0755 "$fixture"
          echo 'R898_HOSTED_FIXTURE_SCOPE_ONLY_NOT_NATIVE_PRODUCT_INSTALL'
